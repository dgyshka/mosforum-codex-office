name: Windows office
on:
  push:
    branches: [main, feature/windows-office]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and PowerShell syntax (5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem *.ps1,tests/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Unit tests failed' }
      - name: Native installer and document tools
        shell: pwsh
        run: ./tests/windows-native-install.ps1
